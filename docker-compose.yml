# MongoDB local cho "Hôm Nay Ăn Gì?"
# Chạy replica set 1 node để dùng được transaction (ghi nhiều collection nguyên tử – NFR14).
services:
  mongo:
    image: mongo:7.0
    container_name: hnag-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - hnag-mongo-data:/data/db
    healthcheck:
      # Khởi tạo replica set lần đầu, sau đó chỉ kiểm tra trạng thái
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }]}).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  # Giao diện web xem dữ liệu (tùy chọn): docker compose --profile tools up -d
  mongo-express:
    image: mongo-express:1.0.2
    profiles: ["tools"]
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://mongo:27017/?directConnection=true"
      ME_CONFIG_BASICAUTH: "false"

volumes:
  hnag-mongo-data:
